## Imports
#
project:
  import:
    # importyaml to avoid eager evaulate as this parent is a condyaml
    model_imp:
      config_file: 'resource(zensols.lmtask): resources/models/gemma4.conf'
      type: importini
    train_imp:
      config_file: 'resource(zensols.lmtask): resources/train-dataset.yml'
      type: importyaml
    train_shared_imp:
      config_file: 'resource(zensols.lmtask): trainconf/imdb-shared.yml'
      type: importyaml


## Defaults
#
lmtask_dataset:
  dataset_name: imdb
  model_name: gemma4
  is_base: false
