#@meta {doc: "some parameters overwrite defaults to make it easy to port this config"}


## Imports
#
project:
  import:
    model_imp:
      config_file: 'resource(zensols.lmtask): resources/models/gemma.conf'
      merge: parent
      type: importini
    train_imp:
      config_file: 'resource(zensols.lmtask): resources/models/gemma-train.yml'
      merge: child
      type: importyaml


## Defaults
#
lmtask_default:
  dataset_name: tinystory
  model_name: gemma


## Train
#
lmtask_trainer_default:
  #source_model: 'google/gemma-4-E4B'
  source_model: 'google/gemma-4-E2B'

lmtask_tinystory_train_source:
  class_name: zensols.lmtask.dataset.LoadedTaskDatasetFactory
  source: roneneldan/TinyStories
  load_args:
    split: 'train[:2500]'
  task: 'instance: lmtask_task_tinystory'

lmtask_tinystory_eval_source:
  class_name: zensols.lmtask.dataset.LoadedTaskDatasetFactory
  source: roneneldan/TinyStories
  load_args:
    split: 'validation[:250]'
  task: 'instance: lmtask_task_tinystory'

lmtask_trainer_hf_training_arguments:
  learning_rate: 5e-6
  num_train_epochs: 3
  optim: 'paged_adamw_32bit'
  lr_scheduler_type: 'cosine'
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  logging_steps: 2

lmtask_trainer_hf_peft:
  r: 128
  lora_alpha: 32
  lora_dropout: 0.05
