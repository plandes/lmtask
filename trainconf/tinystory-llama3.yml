## Imports
#
project:
  import:
    # importyaml to avoid eager evaulate as this parent is a condyaml
    model_imp:
      config_file: 'resource(zensols.lmtask): resources/models/llama3.conf'
      type: importini
    train_imp:
      config_file: 'resource(zensols.lmtask): resources/train-dataset.yml'
      type: importyaml
    train_shared_imp:
      config_file: 'resource(zensols.lmtask): trainconf/tinystory-shared.yml'
      type: importyaml


## Defaults
#
lmtask_dataset:
  dataset_name: tinystory
  model_name: llama3
  is_base: true
