#@meta {author: "Paul Landes"}
#@meta {desc: "Python build configuration", date: "2025-06-06"}

# primary author
author:
  name: Paul Landes
  email: landes@mailc.net
# GitHub account
github:
  user: plandes
# other 'project' section metadata
project:
  domain: zensols
  name: lmtask
  short_description: Train and deploy task-specialized LLMs with PEFT/LoRA and structured inference.
  long_description: >-
    LMTask is a configuration-driven framework for dataset preparation,
    parameter-efficient supervised fine-tuning, structured inference, and
    deployment of task-specialized language models.
  keywords:
    - llm
    - large-language-model
    - fine-tuning
    - supervised-fine-tuning
    - peft
    - lora
    - transformers
    - huggingface
    - structured-output
    - local-llm
    - agent-tools
    - machine-learning
  python:
    # Python interpreter versions
    version:
      # constraint on install eligibility
      required: '>=3.12,<3.15'
      # last supported version of Python supported for the project
      previous: '3.12.13'
      # Python version supported for current development
      current: '3.13.12'
      # version of Python used to build/link specific to the host
      package_host: '3.13.12'
    # pypi dependencies added to 'project'
    dependencies:
      ## third party frameworks
      - 'jinja2~=3.1'
      - 'transformers~=5.5.0'
      # parsing
      - 'partial-json-parser==0.2.1.1.post5'
      # training
      - 'datasets~=4.8.4'
      - 'accelerate==1.13.0'
      - 'peft==0.18.1'
      - 'trl==1.0.0'
      - 'torch~=2.10.0'
      # performance metrics
      - 'scikit-learn~=1.8.0'
      ## caching
      - 'zensols.db~=1.5.0'
      - 'zensols.datdesc~=1.4.9'
  # the program is called on the command line
  has_entry_points: true
build:
  table_appends:
    # training on linux (no binary packages available for osx-arm64)
    tool.pixi.target.linux-64.pypi-dependencies:
      bitsandbytes: '~=0.49.2'
      xformers: '~=0.0.35'
doc:
  api_config:
    intersphinx_mapping:
      util:
        modules: ['zensols.util']
        url: "{RP_DOC_IM_URL}/{package}/"
      numpy:
        modules: ['numpy']
        url: 'https://numpy.org/doc/stable'
      pandas:
        modules: ['pandas']
        url: 'https://pandas.pydata.org/pandas-docs/stable'
      torch:
        modules: ['torch']
        url: 'https://lightning.ai/docs/torchmetrics/stable'
      nlp:
        modules: ['zensols.db']
        url: '{RP_DOC_IM_URL}/{package}/'
  copy:
    BENCHMARKS.md:
    benchmarks:
    trainconf:
    examples:
envdist:
  platforms: [linux-64]
