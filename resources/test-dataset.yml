#@meta {author: "Paul Landes"}
#@meta {desc: "test models trained with train-dataset.yml configs", date: "2026-08-06"}
#@meta {doc: "create new task: copy this, test-dataset-{base/instruct}, replace `_dataset`"}


## Test
#
lmtask_dataset_test_source:
  class_name: zensols.lmtask.dataset.LoadedTaskDatasetFactory
  task: 'instance: lmtask_task_dataset'
  # don't apply the chat template, that will be applied for each inference
  messages_field: null


lmtask_tester:
  class_name: zensols.lmtask.test.Tester
  source: 'instance: lmtask_dataset_test_source'
  task: 'instance: lmtask_task_dataset'
  result_file: 'path: ${lmtask_tester_default:result_file}'


## Benchmark
#
lmtask_benchmark:
  class_name: zensols.lmtask.benchmark.BenchmarkRunner
  name: ${lmtask_dataset:dataset_name}_${lmtask_dataset:model_name}
  # lmtask_benchmark_metrics is given for each model in *-shared.yml type files
  metrics_calculator: 'instance: lmtask_benchmark_metrics'
  trainer: 'alias: lmtask_trainer_default:trainer_name'
  tester: 'instance: lmtask_tester'
  executor: >-
    object({'param': {'logger': logging.getLogger('zensols.lmtask.benchmark.exec')}}):
        zensols.util.executor.Executor
  config_file: "call({'param': {'attribute': 'config_path'}}): config_cli"
  template_dir: 'resource(zensols.lmtask): resources/benchmark'
  result_dir: 'path: ${default:data_dir}/benchmark'
  temporary_dir: 'path: ${default:data_dir}/temp'
