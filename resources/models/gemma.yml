#@meta {author: "Paul Landes"}
#@meta {desc: "gemma default-like objects", date: "2026-04-09"}


## Defaults
#
lmtask_model_generate_args:
  stop_strings: ['<turn|>', '</s>', '<|im_end|>']


## Resources
#
lmtask_gemma_base_resource:
  class_name: zensols.lmtask.gemma4.Gemma4GeneratorResource
  model_id: ${lmtask_default:base_model_id}
  model_args: 'asdict: lmtask_model_args'

lmtask_gemma_instruct_resource:
  class_name: ${lmtask_gemma_base_resource:class_name}
  model_id: ${lmtask_default:instruct_model_id}
  tokenizer_args:
    stop_strings: ${lmtask_model_generate_args:stop_strings}
  model_args: ${lmtask_gemma_base_resource:model_args}


## Generators
#
lmtask_gemma_base_generator:
  class_name: zensols.lmtask.generate.ReplaceTextGenerator
  resource: 'alias: lmtask_default:base_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_args
  tokenize_decode_params:
    skip_special_tokens: true
  replacements:
    - ['<bos>', '']
    - ['<eos>', '']

lmtask_gemma_instruct_generator:
  class_name: zensols.lmtask.instruct.InstructModelTextGenerator
  resource: 'alias: lmtask_default:instruct_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_args
  replacements:
    - ['^```json(.+)```', '\1', DOTALL]
    - ['^```json\n', '']
    - ['<turn\|>', '']


## Training
#
lmtask_trainer_hf_source_resource:
  class_name: ${lmtask_gemma_base_resource:class_name}


## temporary fix for error:
##
# ValueError: Target module Gemma4ClippableLinear((linear): ...) is not
# supported. Currently, only the following modules are supported...
#
# See Gemma4HFTrainerResource class doc.
lmtask_trainer_hf_peft:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

lmtask_trainer_hf_train_resource:
  class_name: zensols.lmtask.gemma4.Gemma4HFTrainerResource
