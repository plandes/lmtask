#@meta {author: "Paul Landes"}
#@meta {desc: "qwen default-like objects", date: "2026-04-09"}


## Resources
#
lmtask_qwen3_base_resource:
  class_name: zensols.lmtask.generate.ConfigGeneratorResource
  model_id: ${lmtask_default:base_model_id}
  model_args: 'asdict: lmtask_model_args'
  code_tokenizer: null
  code_model: null

lmtask_qwen3_instruct_resource:
  class_name: ${lmtask_qwen3_base_resource:class_name}
  model_id: ${lmtask_default:instruct_model_id}
  model_args: ${lmtask_qwen3_base_resource:model_args}
  code_tokenizer: ${lmtask_qwen3_base_resource:code_tokenizer}
  code_model: ${lmtask_qwen3_base_resource:code_model}


## Generators
#
lmtask_qwen3_base_generator:
  class_name: zensols.lmtask.generate.ReplaceTextGenerator
  resource: 'alias: lmtask_default:base_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_base_args
  tokenize_decode_params:
    skip_special_tokens: true
  replacements:
    - ['<\|im_start\|>[^\n]*\n?', '']
    - ['<\|im_end\|>', '']
    - ['^.*?</think>\s*', '', DOTALL]
    - ['^(assistant|user|system|edReader)\s*', '']
    - ['<think>.*\Z', '', DOTALL]

lmtask_qwen3_instruct_generator:
  class_name: zensols.lmtask.instruct.InstructModelTextGenerator
  resource: 'alias: lmtask_default:instruct_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_instruct_args
  replacements: ${lmtask_qwen3_base_generator:replacements}


## Training
#
lmtask_trainer_hf_source_resource:
  class_name: ${lmtask_qwen3_base_resource:class_name}
  code_tokenizer: ${lmtask_qwen3_base_resource:code_tokenizer}
  code_model: ${lmtask_qwen3_base_resource:code_model}

lmtask_trainer_hf_peft:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - lm_head
#    - embed_tokens
