#@meta {author: "Paul Landes"}
#@meta {desc: "DeepSeek-R1-Distill-Qwen objects", date: "2026-06-01"}


## Defaults
#
lmtask_model_generate_instruct_args:
  max_new_tokens: 500


## Resources
#
lmtask_dsr1qwen3_base_resource:
  class_name: zensols.lmtask.generate.ConfigGeneratorResource
  model_id: ${lmtask_default:base_model_id}
  model_args: 'asdict: lmtask_model_args'
  code_tokenizer: null
  code_model: |-
    model.config.pad_token_id = self.tokenizer.pad_token_id
    model.config.eos_token_id = self.tokenizer.eos_token_id
    model.config.bos_token_id = self.tokenizer.bos_token_id
    model.generation_config.pad_token_id = self.tokenizer.pad_token_id
    model.generation_config.eos_token_id = self.tokenizer.eos_token_id
    model.generation_config.bos_token_id = self.tokenizer.bos_token_id

lmtask_dsr1qwen3_instruct_resource:
  class_name: ${lmtask_dsr1qwen3_base_resource:class_name}
  model_id: ${lmtask_default:instruct_model_id}
  model_args: ${lmtask_dsr1qwen3_base_resource:model_args}
  code_tokenizer: ${lmtask_dsr1qwen3_base_resource:code_tokenizer}
  code_model: ${lmtask_dsr1qwen3_base_resource:code_model}


## Generators
#
lmtask_dsr1qwen3_base_generator:
  class_name: zensols.lmtask.generate.ReplaceTextGenerator
  resource: 'alias: lmtask_default:base_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_base_args
  tokenize_decode_params:
    skip_special_tokens: true
  replacements:
    - ['<｜begin▁of▁sentence｜>', '']
    - ['<｜end▁of▁sentence｜>', '']
    - ['<｜User｜>', '']
    - ['<｜Assistant｜>', '']

lmtask_dsr1qwen3_instruct_generator:
  class_name: zensols.lmtask.instruct.InstructModelTextGenerator
  resource: 'alias: lmtask_default:instruct_resource'
  generate_params: >-
    call({'param': {'method': 'asdict'}}): lmtask_model_generate_instruct_args
  tokenize_decode_params:
    skip_special_tokens: true
  replacements:
    - ['<｜begin▁of▁sentence｜>', '']
    - ['<｜end▁of▁sentence｜>', '']
    - ['<｜User｜>', '']
    - ['<｜Assistant｜>', '']
    - ['```json\s*', '']
    - ['```\s*', '']
    - ['^.*?</think>\s*', '', DOTALL]
    - ['<think>.*\Z', '', DOTALL]
    - ['^(assistant|user|system|edReader)\s*', '']
  # appends the model's assistant-start marker to the chat template so the
  # model knows it should generate the assistant's next response
  chat_template_args:
    add_generation_prompt: true


## Training
#
lmtask_trainer_hf_source_resource:
  class_name: ${lmtask_dsr1qwen3_base_resource:class_name}
  code_tokenizer: ${lmtask_dsr1qwen3_base_resource:code_tokenizer}
  code_model: ${lmtask_dsr1qwen3_base_resource:code_model}

lmtask_trainer_hf_peft:
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
