#@meta {author: "Paul Landes"}
#@meta {desc: "llama model configurations", date: "2026-04-06"}


[import]
sections = tuple: llama_imp

[llama_imp]
type = condyaml
config_file = resource(zensols.lmtask): resources/models/llama3.yml

[lmtask_default]
base_resource_class = zensols.lmtask.generate.ConfigGeneratorResource
base_generator = lmtask_llama_base_generator
base_resource = lmtask_llama_base_resource
instruct_resource_class = ${lmtask_default:base_resource_class}
instruct_generator = lmtask_llama_instruct_generator
instruct_resource = lmtask_llama_instruct_resource
## the model used for inference and training
## models:
# - unsloth/llama-3-70b-bnb-4bit
# - unsloth/llama-3-8b-Instruct-bnb-4bit
# - meta-llama/Llama-3.1-8B
# - meta-llama/Llama-3.1-8B-Instruct
base_model_id = meta-llama/Llama-3.1-8B
instruct_model_id = meta-llama/Llama-3.1-8B-Instruct
